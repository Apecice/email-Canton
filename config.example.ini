; 复制本文件为 config.ini 后填写，config.ini 已被 .gitignore 忽略，不会被提交。
; Copy this file to config.ini and fill it in. config.ini is git-ignored.

[imap]
host = imap.cantonservices.com.hk
port = 993
ssl = true
user = xxx@cantonservices.com.hk
password = 你的邮箱密码或授权码
folder = INBOX

; 可选：用于网络探测 SMTP 端口（不收发邮件，仅测连通性/延迟）
[smtp]
host = smtp.cantonservices.com.hk
ports = 587,465

[monitor]
; idle = 用 IMAP IDLE 长连接（最能抓到"连接被静默掐断"），需要 pip install imapclient
; poll = 仅用标准库，每隔 N 秒重连+查询（任何环境都能跑）
mode = idle
poll_seconds = 30
; IDLE 每隔多少秒主动 NOOP 一次来确认连接是否还活着；建议 300 以内
idle_refresh_seconds = 300
; 给这个观测点起个名字，两台机器要用不同名字以便对比
; 例如出问题的大陆电脑用 mainland-win，对照的香港/海外机器用 hk-control
vantage = mainland-win

[privacy]
; hash = 对发件人/收件人/主题做不可逆哈希（默认，可安全外发）
; full = 保留原文（仅自己本地排查时用）
; none = 完全不记录这些字段
redact = hash
; 哈希用的盐值，随便改成你自己的一串字符即可
salt = change-this-to-any-random-string
